name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v0.1.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish linux/amd64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Resolve version
        id: v
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        run: go test ./...

      - name: Build
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -trimpath \
            -ldflags="-s -w -X main.version=${{ steps.v.outputs.tag }}" \
            -o obs-web-deck .
          file obs-web-deck

      # Ship the default config alongside the binary. obs-web-deck writes these
      # itself on first run, but having them in the tarball makes the settings
      # discoverable without starting it first.
      - name: Package
        run: |
          name=obs-web-deck-${{ steps.v.outputs.tag }}-linux-amd64
          mkdir -p "$name"
          cp obs-web-deck README.md LICENSE "$name"/
          cp -r config "$name"/
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          ls -la

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${{ steps.v.outputs.tag }}
          gh release create "$tag" \
            --title "$tag" \
            --generate-notes \
            obs-web-deck-"$tag"-linux-amd64.tar.gz \
            obs-web-deck-"$tag"-linux-amd64.tar.gz.sha256 \
          || gh release upload "$tag" \
            obs-web-deck-"$tag"-linux-amd64.tar.gz \
            obs-web-deck-"$tag"-linux-amd64.tar.gz.sha256 --clobber
