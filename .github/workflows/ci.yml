name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (linux/amd64)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # The live OBS checks are env-gated and skip here; the media tests run a
      # real Pion publisher and subscriber over loopback and do not need OBS.
      - name: Test
        run: go test -race ./...

      - name: Build
        env:
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags="-s -w" -o obs-web-deck .

      # A dynamically linked binary would fail on a machine with a different
      # glibc, which defeats the point of shipping one file.
      - name: Verify the binary is static
        run: |
          file obs-web-deck
          if ldd obs-web-deck 2>&1 | grep -qv 'not a dynamic executable'; then
            echo "binary is dynamically linked"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: obs-web-deck-linux-amd64
          path: obs-web-deck
          retention-days: 14
