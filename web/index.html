<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#08090b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>OBS Deck</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/stage.css">
  <link rel="stylesheet" href="/css/deck.css">
  <link rel="stylesheet" href="/css/ptz.css">
  <link rel="stylesheet" href="/css/editor.css">
</head>
<body>
  <div class="app">
    <section class="stage" id="stage">
      <video id="preview" autoplay playsinline muted></video>
      <div class="stage-empty">
        <span id="stage-empty-text">Waiting for OBS to publish…</span>
      </div>

      <div class="stage-hud">
        <div class="hud-left">
          <span class="pill" id="pill-obs" data-state="off">OBS</span>
          <span class="pill" id="pill-stream" data-state="off">LIVE</span>
          <span class="pill" id="pill-record" data-state="off">REC</span>
        </div>
        <div class="hud-right">
          <span class="stat" id="stat-latency">— ms</span>
          <button class="hud-btn" id="btn-audio" title="Preview audio"></button>
          <button class="hud-btn" id="btn-full" title="Fullscreen"></button>
        </div>
      </div>

      <div class="scene-tag" id="scene-tag"></div>
    </section>

    <section class="deck">
      <nav class="bar">
        <div class="pages" id="pages"></div>
        <!-- Column width picker, shown only in edit mode. -->
        <div class="cols" id="cols" hidden role="group" aria-label="Grid columns"></div>
        <!-- Scene tiles on or off for this page. Edit mode only. -->
        <button class="edit-btn" id="btn-auto" hidden aria-pressed="false"></button>
        <button class="edit-btn" id="btn-edit" title="Edit buttons"></button>
      </nav>

      <div class="grid-wrap" id="grid-wrap">
        <div class="grid" id="grid"></div>
      </div>

      <div class="ptz" id="ptz" hidden>
        <div class="ptz-main">
          <div class="stick" id="stick">
            <div class="stick-ring"></div>
            <div class="stick-cross"></div>
            <div class="stick-knob" id="stick-knob"></div>
            <div class="stick-hint">PAN / TILT</div>
          </div>
          <div class="presets" id="presets"></div>
        </div>

        <!-- Spring-return zoom rocker: hold off centre to keep zooming, let go
             to stop and snap back. -->
        <div class="rocker-wrap">
          <div class="rocker" id="rocker">
            <div class="rocker-track"></div>
            <span class="rocker-tick rocker-tick-out">ZOOM OUT</span>
            <span class="rocker-detent"></span>
            <span class="rocker-tick rocker-tick-in">ZOOM IN</span>
            <div class="rocker-knob" id="rocker-knob"></div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <!-- Button editor -->
  <div class="sheet-scrim" id="scrim" hidden></div>
  <aside class="sheet" id="sheet" hidden>
    <header class="sheet-head">
      <strong id="sheet-title">Edit button</strong>
      <button class="sheet-x" id="sheet-close">✕</button>
    </header>

    <div class="sheet-body">
      <label class="field">
        <span>Label</span>
        <input type="text" id="f-label" maxlength="24" placeholder="Cam 1">
      </label>

      <div class="field">
        <span>Icon</span>
        <div class="icon-grid" id="f-icons"></div>
      </div>

      <div class="field">
        <span>Colour</span>
        <div class="swatches" id="f-colors"></div>
      </div>

      <!-- Chain steps. One step is an ordinary button; add a second and the
           tile runs them in order. The fields below always edit the selected
           step. -->
      <div class="field" id="w-steps">
        <span>Steps</span>
        <div class="steps" id="f-steps"></div>
      </div>

      <label class="field" id="w-delay" hidden>
        <span>Wait before this step</span>
        <input type="number" id="f-delay" min="0" max="2000" step="50" value="0">
        <small class="hint">Milliseconds. Every request already waits for OBS to
          answer, so most chains need none of this. It is for letting a
          transition play out first: OBS reports one as done the moment it
          starts, not when it finishes.</small>
      </label>

      <label class="field" id="w-action">
        <span>Action</span>
        <select id="f-action">
          <option value="">— none —</option>
          <option value="scene">Switch program scene</option>
          <option value="preview">Set preview scene</option>
          <option value="transition">Transition / cut</option>
          <option value="crossfade">Crossfade to preview (partial)</option>
          <option value="source">Toggle source visibility</option>
          <option value="mute">Toggle audio mute</option>
          <option value="stream">Toggle streaming</option>
          <option value="record">Toggle recording</option>
          <option value="recordPause">Pause / resume recording</option>
          <option value="replay">Save replay buffer</option>
          <option value="hotkey">OBS hotkey (any keybind)</option>
          <option value="ptzPreset">Camera preset recall</option>
          <option value="page">Switch deck page</option>
        </select>
      </label>

      <label class="field" id="w-scene" hidden>
        <span>Scene</span>
        <select id="f-scene"></select>
      </label>

      <label class="field" id="w-source" hidden>
        <span>Source</span>
        <select id="f-source"></select>
      </label>

      <label class="field" id="w-input" hidden>
        <span>Audio input</span>
        <select id="f-input"></select>
      </label>

      <label class="field" id="w-hotkey" hidden>
        <span>Hotkey</span>
        <input type="text" id="f-hotkey-filter" placeholder="Filter…" autocomplete="off">
        <select id="f-hotkey" size="8"></select>
        <small class="hint">Every OBS keybind appears here, including plugin
          hotkeys. Prefer a native action above where one exists.</small>
      </label>

      <label class="field" id="w-preset" hidden>
        <span>Camera preset slot</span>
        <input type="number" id="f-preset" min="1" max="64" value="1">
        <small class="hint">obs-ptz exposes no preset list, so the slot number
          is yours to assign. Long-press a preset on the Camera page to store
          the camera's current position into it; it asks before overwriting.</small>
      </label>

      <label class="field" id="w-percent" hidden>
        <span>Crossfade amount (%)</span>
        <input type="number" id="f-percent" min="0" max="100" step="5" value="50">
        <small class="hint">Holds the studio-mode T-bar this far from program
          toward preview, mixing the two on air. The mix stays up until another
          crossfade, a transition or a scene button ends it: 0 returns to
          program only, 100 completes the swap like a full transition.</small>
      </label>

      <label class="field" id="w-page" hidden>
        <span>Go to page</span>
        <select id="f-page"></select>
      </label>

      <label class="check" id="w-feedback" hidden>
        <input type="checkbox" id="f-feedback" checked>
        <span>Light the button up when this is active</span>
      </label>

      <!-- Scene gate. Always offered: any button can be wrong for the scene
           that happens to be on air. -->
      <div class="field" id="w-enable">
        <span>Available in</span>
        <select id="f-enable-mode">
          <option value="">Every scene</option>
          <option value="only">Only the scenes below</option>
          <option value="except">Every scene except those below</option>
        </select>
        <div class="scene-chips" id="f-enable-scenes" hidden></div>
        <small class="hint" id="f-enable-hint" hidden>Outside these scenes the
          button dims and does nothing. Editing still reaches it.</small>
      </div>
    </div>

    <footer class="sheet-foot">
      <button class="btn danger" id="btn-clear">Clear</button>
      <button class="btn" id="btn-cancel">Cancel</button>
      <button class="btn primary" id="btn-save">Save</button>
    </footer>
  </aside>

  <!-- Confirm. For the handful of presses that overwrite something the deck
       cannot get back; the toast is only ever after the fact. -->
  <div class="modal-scrim" id="confirm-scrim" hidden></div>
  <div class="modal" id="confirm" role="dialog" aria-modal="true"
       aria-labelledby="confirm-title" hidden>
    <strong class="modal-title" id="confirm-title"></strong>
    <p class="modal-text" id="confirm-text"></p>
    <div class="modal-foot">
      <button class="btn" id="confirm-no">Cancel</button>
      <button class="btn primary" id="confirm-yes">OK</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
